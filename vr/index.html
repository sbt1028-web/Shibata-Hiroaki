<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>VR街あるき ― 蟻から巨人まで（A-Frame）</title>
  <meta name="description" content="A-Frameで作成した、Google Cardboard対応のVR散策コンテンツ">
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; }
    #intro {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      background: rgba(18, 28, 40, 0.78); color: #fff;
    }
    #intro .card {
      max-width: 560px; margin: 16px; padding: 24px 28px; border-radius: 14px;
      background: rgba(255, 255, 255, 0.08); line-height: 1.7;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    #intro h1 { margin: 0 0 6px; font-size: 1.45rem; }
    #intro .sub { margin: 0 0 14px; opacity: 0.8; font-size: 0.9rem; }
    #intro ul { margin: 0 0 18px; padding-left: 1.2em; font-size: 0.95rem; }
    #intro button {
      font: inherit; font-size: 1.05rem; font-weight: bold;
      padding: 12px 28px; border: 0; border-radius: 999px;
      background: #ffb547; color: #1d2633; cursor: pointer;
    }
    #intro.hidden { display: none; }
    #intro .btns { display: flex; flex-wrap: wrap; gap: 10px; }
    #intro { overflow-y: auto; }
    @media (max-height: 520px) {
      #intro { align-items: flex-start; }
      #intro .card { padding: 14px 20px; line-height: 1.5; }
      #intro h1 { font-size: 1.15rem; }
      #intro .sub { margin-bottom: 6px; }
      #intro ul { margin-bottom: 10px; font-size: 0.82rem; }
      #intro button { font-size: 0.92rem; padding: 9px 18px; }
    }
    #intro button.alt { background: #4b6a8f; color: #fff; }
    /* 左右2画面モード */
    #divider { display: none; position: fixed; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: #000; z-index: 5; pointer-events: none; }
    #stereo-btn {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6;
      font: inherit; font-size: 0.85rem; padding: 8px 16px; border: 0; border-radius: 999px;
      background: rgba(29,38,51,0.75); color: #fff; cursor: pointer;
    }
    body.stereo #divider { display: block; }
    body.stereo #stereo-btn { opacity: 0.45; }
    #rotate-hint { display: none; position: fixed; inset: 0; z-index: 7; background: rgba(18,28,40,0.92); color: #fff;
      align-items: center; justify-content: center; text-align: center; font-size: 1.2rem; line-height: 1.8; }
    @media (orientation: portrait) { body.stereo #rotate-hint { display: flex; } }
  </style>
</head>
<body>

<div id="intro">
  <div class="card">
    <h1>VR街あるき ― 蟻から巨人まで</h1>
    <p class="sub">空間情報コンピューティング 第7回課題 ／ A-Frame 1.8.0</p>
    <ul>
      <li>頭（スマホ）を動かすか、マウスでドラッグして見回す</li>
      <li><b>光る柱</b>を見つめる（約1.5秒）かクリックすると、その場所へ移動</li>
      <li><b>足元を見る</b>とメニュー。蟻・人・巨人の視点、昼／夜を切替</li>
      <li>Cardboardで見るときは「2画面ではじめる」を選び、スマホを横向きにしてセット</li>
      <li>PCはWASDキーでも移動できます</li>
    </ul>
    <div class="btns">
      <button id="start-btn">体験をはじめる</button>
      <button id="start-stereo-btn" class="alt">2画面（Cardboard）ではじめる</button>
    </div>
  </div>
</div>

<div id="divider"></div>
<button id="stereo-btn">2画面表示</button>
<div id="rotate-hint">スマートフォンを横向きにしてください<br>（画面の向きのロックを解除）</div>

<script>
/* =====================================================================
   共通ユーティリティ
   ===================================================================== */
const THREE = AFRAME.THREE;
const FONT = '"Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif';

// 再現性のある乱数（毎回同じ街並みになるように）
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function canvasTexture(canvas, repeatX, repeatY, srgb) {
  const tex = new THREE.CanvasTexture(canvas);
  if (srgb !== false) tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeatX || 1, repeatY || 1);
  tex.anisotropy = 4;
  return tex;
}

// 日本語テキストをcanvasに描く（A-Frame標準のa-textは日本語非対応のため）
function drawTextCanvas(o) {
  const fs = o.fontSize || 52, pad = o.padding || 30, maxW = o.maxWidth || 1000;
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const titleFs = Math.round(fs * 1.25);
  const wrap = (txt, font) => {
    ctx.font = font;
    const out = [];
    txt.split('|').forEach(par => {
      let line = '';
      for (const ch of par) {
        if (ctx.measureText(line + ch).width > maxW - pad * 2 && line) { out.push(line); line = ch; }
        else line += ch;
      }
      out.push(line);
    });
    return out;
  };
  const bodyFont = `${fs}px ${FONT}`, titleFont = `bold ${titleFs}px ${FONT}`;
  const titleLines = o.title ? wrap(o.title, titleFont) : [];
  const lines = o.text ? wrap(o.text, bodyFont) : [];
  let w = 0;
  ctx.font = titleFont; titleLines.forEach(l => w = Math.max(w, ctx.measureText(l).width));
  ctx.font = bodyFont; lines.forEach(l => w = Math.max(w, ctx.measureText(l).width));
  const lhT = titleFs * 1.35, lhB = fs * 1.45;
  c.width = Math.ceil(o.fixedWidth || (w + pad * 2));
  c.height = Math.ceil(pad * 2 + titleLines.length * lhT + (titleLines.length && lines.length ? fs * 0.4 : 0) + lines.length * lhB);
  if (o.fixedHeight) c.height = o.fixedHeight;
  // 背景（角丸）
  const r = Math.min(36, c.height / 2);
  ctx.fillStyle = o.bg || 'rgba(255,255,255,0.93)';
  ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(2, 2, c.width - 4, c.height - 4, r); else ctx.rect(2, 2, c.width - 4, c.height - 4); ctx.fill();
  if (o.border) { ctx.lineWidth = 6; ctx.strokeStyle = o.border; ctx.stroke(); }
  ctx.textBaseline = 'middle';
  ctx.textAlign = o.align === 'left' ? 'left' : 'center';
  const x = o.align === 'left' ? pad : c.width / 2;
  const blockH = titleLines.length * lhT + (titleLines.length && lines.length ? fs * 0.4 : 0) + lines.length * lhB;
  let y = (c.height - blockH) / 2;
  ctx.fillStyle = o.titleColor || o.color || '#1d2633'; ctx.font = titleFont;
  titleLines.forEach(l => { ctx.fillText(l, x, y + lhT / 2); y += lhT; });
  if (titleLines.length && lines.length) y += fs * 0.4;
  ctx.fillStyle = o.color || '#1d2633'; ctx.font = bodyFont;
  lines.forEach(l => { ctx.fillText(l, x, y + lhB / 2); y += lhB; });
  return c;
}

// 昼夜の切替を受け取る関数の登録先（t=0:昼 → t=1:夜）
const NIGHT = { fns: [], add(fn) { this.fns.push(fn); fn(0); }, apply(t) { this.fns.forEach(f => f(t)); } };
const $id = id => document.getElementById(id);
const lerp = (a, b, t) => a + (b - a) * t;
const lerpColor = (a, b, t) => new THREE.Color(a).lerp(new THREE.Color(b), t);

/* =====================================================================
   コンポーネント：表示系
   ===================================================================== */

// 日本語ラベル（板ポリゴンにcanvasを貼る）
AFRAME.registerComponent('jp-label', {
  schema: {
    text: { default: '' }, title: { default: '' }, width: { default: 1.6 },
    fontSize: { default: 52 }, color: { default: '#1d2633' }, bg: { default: 'rgba(255,255,255,0.93)' },
    border: { default: '' }, align: { default: 'center' }, billboard: { default: false }, maxWidth: { default: 1000 }
  },
  update() {
    const d = this.data;
    const c = drawTextCanvas({ text: d.text, title: d.title, fontSize: d.fontSize, color: d.color, bg: d.bg, border: d.border, align: d.align, maxWidth: d.maxWidth });
    const tex = canvasTexture(c, 1, 1); tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
    const h = d.width * c.height / c.width;
    if (this.mesh) { this.mesh.geometry.dispose(); this.mesh.material.map.dispose(); this.mesh.material.dispose(); }
    this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(d.width, h),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.02, side: THREE.DoubleSide, fog: false }));
    this.el.setObject3D('mesh', this.mesh);
  },
  tick() {
    if (!this.data.billboard) return;
    const cam = this.el.sceneEl.camera; if (!cam) return;
    const cp = new THREE.Vector3(), p = new THREE.Vector3();
    cam.getWorldPosition(cp); this.el.object3D.getWorldPosition(p);
    this.el.object3D.rotation.y = Math.atan2(cp.x - p.x, cp.z - p.z);
  }
});

// グラデーションの空（昼夜で色が変わる）
AFRAME.registerComponent('grad-sky', {
  init() {
    this.uniforms = {
      top: { value: new THREE.Color('#3d8fe0') }, bottom: { value: new THREE.Color('#dcebf5') },
      offset: { value: 20 }, exponent: { value: 0.7 }
    };
    const mat = new THREE.ShaderMaterial({
      uniforms: this.uniforms, side: THREE.BackSide, depthWrite: false, fog: false,
      vertexShader: 'varying vec3 vP; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vP = w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }',
      fragmentShader: 'uniform vec3 top; uniform vec3 bottom; uniform float offset; uniform float exponent; varying vec3 vP;' +
        'void main(){ float h = normalize(vP + vec3(0.0, offset, 0.0)).y; gl_FragColor = vec4(mix(bottom, top, max(pow(max(h,0.0), exponent), 0.0)), 1.0); }'
    });
    const sky = new THREE.Mesh(new THREE.SphereGeometry(450, 32, 16), mat);
    sky.renderOrder = -10;
    this.el.setObject3D('mesh', sky);
    // 星
    const rnd = mulberry32(7), pts = [];
    for (let i = 0; i < 700; i++) {
      const th = rnd() * Math.PI * 2, ph = Math.acos(rnd() * 0.95), r = 420;
      pts.push(r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th));
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    const sm = new THREE.PointsMaterial({ color: '#ffffff', size: 2, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
    this.el.setObject3D('stars', new THREE.Points(g, sm));
    NIGHT.add(t => {
      this.uniforms.top.value.copy(lerpColor('#3d8fe0', '#050b1e', t));
      this.uniforms.bottom.value.copy(lerpColor('#dcebf5', '#1c2a4a', t));
      sm.opacity = Math.max(0, (t - 0.4) / 0.6);
    });
  },
  tick() {
    // 空は常にカメラ中心に（巨人視点でも端が見えないように）
    const cam = this.el.sceneEl.camera; if (!cam) return;
    cam.getWorldPosition(this.el.object3D.position);
  }
});

// 地面などのテクスチャ（芝・石畳・道路）
const TEX = {};
function makeTextures() {
  const rnd = mulberry32(3);
  // 芝
  let c = document.createElement('canvas'); c.width = c.height = 256; let x = c.getContext('2d');
  x.fillStyle = '#6fae55'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) {
    x.fillStyle = `hsl(${95 + rnd() * 25}, ${35 + rnd() * 25}%, ${30 + rnd() * 22}%)`;
    x.fillRect(rnd() * 256, rnd() * 256, 2, 2 + rnd() * 4);
  }
  TEX.grass = c;
  // 石畳
  c = document.createElement('canvas'); c.width = c.height = 256; x = c.getContext('2d');
  x.fillStyle = '#b9b2a5'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    x.fillStyle = `hsl(35, ${8 + rnd() * 8}%, ${62 + rnd() * 12}%)`;
    x.fillRect(i * 64 + 2, j * 64 + 2, 60, 60);
  }
  TEX.stone = c;
  // アスファルト
  c = document.createElement('canvas'); c.width = c.height = 128; x = c.getContext('2d');
  x.fillStyle = '#4a4d52'; x.fillRect(0, 0, 128, 128);
  for (let i = 0; i < 900; i++) { x.fillStyle = `rgba(255,255,255,${rnd() * 0.08})`; x.fillRect(rnd() * 128, rnd() * 128, 1.5, 1.5); }
  TEX.asphalt = c;
  // センターライン（破線）
  c = document.createElement('canvas'); c.width = 16; c.height = 64; x = c.getContext('2d');
  x.clearRect(0, 0, 16, 64); x.fillStyle = '#f4f1e8'; x.fillRect(0, 0, 16, 36);
  TEX.dash = c;
  // 横断歩道
  c = document.createElement('canvas'); c.width = 64; c.height = 16; x = c.getContext('2d');
  x.clearRect(0, 0, 64, 16); x.fillStyle = '#f4f1e8'; x.fillRect(0, 0, 32, 16);
  TEX.zebra = c;
}

AFRAME.registerComponent('textured-plane', {
  schema: { tex: { default: 'grass' }, w: { default: 10 }, h: { default: 10 }, repeat: { type: 'vec2', default: { x: 1, y: 1 } },
    transparent: { default: false }, roughness: { default: 0.95 } },
  init() {
    if (!TEX.grass) makeTextures();
    const d = this.data;
    const mat = new THREE.MeshStandardMaterial({ map: canvasTexture(TEX[d.tex], d.repeat.x, d.repeat.y), roughness: d.roughness,
      transparent: d.transparent, alphaTest: d.transparent ? 0.3 : 0 });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(d.w, d.h), mat);
    m.rotation.x = -Math.PI / 2; m.receiveShadow = true;
    this.el.setObject3D('mesh', m);
  }
});

AFRAME.registerComponent('textured-circle', {
  schema: { tex: { default: 'stone' }, r: { default: 8 }, repeat: { default: 4 } },
  init() {
    if (!TEX.grass) makeTextures();
    const m = new THREE.Mesh(new THREE.CircleGeometry(this.data.r, 48),
      new THREE.MeshStandardMaterial({ map: canvasTexture(TEX[this.data.tex], this.data.repeat, this.data.repeat), roughness: 0.9 }));
    m.rotation.x = -Math.PI / 2; m.receiveShadow = true;
    this.el.setObject3D('mesh', m);
  }
});

/* =====================================================================
   コンポーネント：街の構成要素
   ===================================================================== */

// ビル（窓テクスチャ付き。夜は窓が光る）
function windowCanvases(wallColor, seed) {
  const rnd = mulberry32(seed), N = 4, U = 64;
  const a = document.createElement('canvas'), e = document.createElement('canvas');
  a.width = a.height = e.width = e.height = N * U;
  const ax = a.getContext('2d'), ex = e.getContext('2d');
  ax.fillStyle = wallColor; ax.fillRect(0, 0, N * U, N * U);
  ex.fillStyle = '#000'; ex.fillRect(0, 0, N * U, N * U);
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    const gx = i * U + 12, gy = j * U + 14, gw = U - 24, gh = U - 26;
    const grd = ax.createLinearGradient(gx, gy, gx + gw, gy + gh);
    grd.addColorStop(0, '#9fc1de'); grd.addColorStop(1, '#4f6f8f');
    ax.fillStyle = grd; ax.fillRect(gx, gy, gw, gh);
    if (rnd() < 0.62) { ex.fillStyle = rnd() < 0.8 ? '#ffd59a' : '#cfe6ff'; ex.fillRect(gx, gy, gw, gh); }
  }
  return [a, e];
}
const BUILDING_MATS = [];
AFRAME.registerComponent('building', {
  schema: { w: { default: 8 }, d: { default: 8 }, h: { default: 20 }, color: { default: '#d9d4cc' }, seed: { default: 1 } },
  init() {
    const { w, d, h, color, seed } = this.data;
    const [a, e] = windowCanvases(color, seed);
    const wall = (width) => {
      const rx = width / 12, ry = h / 12.8;
      const m = new THREE.MeshStandardMaterial({ map: canvasTexture(a, rx, ry), emissive: new THREE.Color('#ffffff'),
        emissiveMap: canvasTexture(e, rx, ry), emissiveIntensity: 0, roughness: 0.75, metalness: 0.05 });
      BUILDING_MATS.push(m); return m;
    };
    const roof = new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(0.7), roughness: 0.9 });
    const mats = [wall(d), wall(d), roof, roof, wall(w), wall(w)];
    const box = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats);
    box.position.y = h / 2; box.castShadow = true; box.receiveShadow = true;
    const grp = new THREE.Group(); grp.add(box);
    // 屋上の設備
    const rnd = mulberry32(seed * 13);
    if (rnd() < 0.7) {
      const u = new THREE.Mesh(new THREE.BoxGeometry(w * 0.3, 1.4, d * 0.3), new THREE.MeshStandardMaterial({ color: '#9aa0a6' }));
      u.position.set((rnd() - 0.5) * w * 0.4, h + 0.7, (rnd() - 0.5) * d * 0.4); u.castShadow = true; grp.add(u);
    }
    this.el.setObject3D('mesh', grp);
  }
});
NIGHT.add(t => BUILDING_MATS.forEach(m => m.emissiveIntensity = t * 0.95));

// 区画内にビルを並べる
AFRAME.registerComponent('city-block', {
  schema: { x0: { default: 0 }, z0: { default: 0 }, x1: { default: 10 }, z1: { default: 10 }, cols: { default: 3 }, rows: { default: 3 },
    hmin: { default: 6 }, hmax: { default: 30 }, seed: { default: 1 }, fill: { default: 0.75 } },
  init() {
    const d = this.data, rnd = mulberry32(d.seed);
    const colors = ['#d9d4cc', '#c9cfd6', '#e6dccb', '#b9c3c9', '#d7c6b4', '#cbd3c4', '#efe9df'];
    const cw = (d.x1 - d.x0) / d.cols, rh = (d.z1 - d.z0) / d.rows;
    for (let i = 0; i < d.cols; i++) for (let j = 0; j < d.rows; j++) {
      if (rnd() > 0.92) continue;
      const w = cw * (d.fill + rnd() * 0.12), dep = rh * (d.fill + rnd() * 0.12);
      const h = Math.round(d.hmin + Math.pow(rnd(), 1.6) * (d.hmax - d.hmin));
      const b = document.createElement('a-entity');
      b.setAttribute('position', `${d.x0 + cw * (i + 0.5)} 0 ${d.z0 + rh * (j + 0.5)}`);
      b.setAttribute('building', { w, d: dep, h, color: colors[Math.floor(rnd() * colors.length)], seed: d.seed * 100 + i * 10 + j });
      this.el.appendChild(b);
    }
  }
});

// 木（丸い木／針葉樹）
const treeMats = {};
function treeMesh(rnd, scale) {
  if (!treeMats.trunk) {
    treeMats.trunk = new THREE.MeshStandardMaterial({ color: '#7a5a3c', roughness: 1 });
    treeMats.leaf = [0, 1, 2].map(i => new THREE.MeshStandardMaterial({ color: ['#3f8a3a', '#4f9e45', '#2f6f3a'][i], roughness: 0.95 }));
  }
  const g = new THREE.Group(), s = scale * (0.8 + rnd() * 0.5);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * s, 0.25 * s, 2 * s, 7), treeMats.trunk);
  trunk.position.y = s; trunk.castShadow = true; g.add(trunk);
  const mat = treeMats.leaf[Math.floor(rnd() * 3)];
  if (rnd() < 0.5) {
    for (let k = 0; k < 3; k++) {
      const cone = new THREE.Mesh(new THREE.ConeGeometry((1.7 - k * 0.4) * s, 2 * s, 8), mat);
      cone.position.y = (2.2 + k * 1.1) * s; cone.castShadow = true; g.add(cone);
    }
  } else {
    const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5 * s, 1), mat);
    ball.position.y = 3 * s; ball.scale.y = 1.1; ball.castShadow = true; g.add(ball);
    const b2 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.0 * s, 1), mat);
    b2.position.set(0.8 * s, 2.5 * s, 0.3 * s); b2.castShadow = true; g.add(b2);
  }
  g.rotation.y = rnd() * Math.PI * 2;
  return g;
}
AFRAME.registerComponent('forest', {
  schema: { x0: { default: 0 }, z0: { default: 0 }, x1: { default: 10 }, z1: { default: 10 }, count: { default: 30 }, seed: { default: 1 },
    clearX: { default: 9999 }, clearZ: { default: 9999 }, clearR: { default: 0 }, scale: { default: 1 } },
  init() {
    const d = this.data, rnd = mulberry32(d.seed), grp = new THREE.Group();
    let n = 0, guard = 0;
    while (n < d.count && guard++ < d.count * 10) {
      const x = d.x0 + rnd() * (d.x1 - d.x0), z = d.z0 + rnd() * (d.z1 - d.z0);
      if (Math.hypot(x - d.clearX, z - d.clearZ) < d.clearR) continue;
      const t = treeMesh(rnd, d.scale); t.position.set(x, 0, z); grp.add(t); n++;
    }
    this.el.setObject3D('mesh', grp);
  }
});
AFRAME.registerComponent('tree', {
  schema: { seed: { default: 1 }, scale: { default: 1 } },
  init() { this.el.setObject3D('mesh', treeMesh(mulberry32(this.data.seed), this.data.scale)); }
});

// 円を描いて飛ぶ（鳥）
AFRAME.registerComponent('circle-fly', {
  schema: { radius: { default: 14 }, speed: { default: 0.35 }, phase: { default: 0 }, y: { default: 16 } },
  tick(t) {
    const d = this.data, a = t / 1000 * d.speed + d.phase, o = this.el.object3D;
    o.position.set(Math.cos(a) * d.radius, d.y + Math.sin(a * 3) * 0.8, Math.sin(a) * d.radius);
    o.rotation.y = -a;
    const wing = Math.sin(t / 90 + d.phase * 10) * 0.6;
    if (this.el.children[0]) this.el.children[0].object3D.rotation.z = wing;
    if (this.el.children[1]) this.el.children[1].object3D.rotation.z = -wing;

});

// 足元メニュー：前を見ている間は顔の向きについてきて、下を見ると止まる
AFRAME.registerComponent('foot-menu', {
  init() { this.dir = new THREE.Vector3(); this.yaw = 0; },
  tick(t, dt) {
    const camEl = document.getElementById('cam'), cam = this.el.sceneEl.camera; if (!cam || !dt) return;
    cam.getWorldDirection(this.dir);
    const pitch = Math.asin(THREE.MathUtils.clamp(this.dir.y, -1, 1));
    if (pitch > -0.45) {
      const target = Math.atan2(-this.dir.x, -this.dir.z);
      let diff = target - this.yaw; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
      this.yaw += diff * Math.min(1, dt / 250);
    }
    const o = this.el.object3D, cp = camEl.object3D.position;
    o.position.set(cp.x, 0, cp.z);
    o.rotation.y = this.yaw;
  }
});

/* =====================================================================
   アプリ全体の制御：移動・視点スケール・昼夜
   ===================================================================== */
const SCALES = { ant: 0.06, human: 1, giant: 18 };
AFRAME.registerComponent('vr-app', {
  init() {
    this.state = { scale: 'human', night: false };
    this.nightT = 0;
    this.busy = false;
    this.el.addEventListener('ui-action', e => this.onAction(e.detail));
    window.vrApp = this;
    const setup = () => {
      this.currentSpot = document.querySelector('[teleport-spot]').components['teleport-spot'];
      this.currentSpot.setHere(true);
    };
    if (this.el.hasLoaded) setup(); else this.el.addEventListener('loaded', setup);
  },

  // 暗転しながら瞬間移動（VR酔いを起こしにくい移動方法）
  blink(fn) {
    // 暗転中に次の操作が来たら、終わってから順に実行する
    if (this.busy) { (this.queue = this.queue || []).push(fn); return; }
    this.busy = true;
    const m = $id('fade').getObject3D('mesh').material;
    const start = performance.now(), D = 180;
    const step = () => {
      const k = (performance.now() - start) / D;
      if (k < 1) { m.opacity = k; requestAnimationFrame(step); return; }
      m.opacity = 1; fn();
      const s2 = performance.now();
      const step2 = () => {
        const k2 = (performance.now() - s2) / (D * 1.4);
        m.opacity = Math.max(0, 1 - k2);
        if (k2 < 1) requestAnimationFrame(step2);
        else { this.busy = false; const next = this.queue && this.queue.shift(); if (next) this.blink(next); }
      };
      setTimeout(() => requestAnimationFrame(step2), 80);
    };
    step();
  },
  teleport(p, spot) {
    this.blink(() => {
      $id('rig').object3D.position.set(p.x, p.y, p.z);
      $id('cam').object3D.position.x = 0; $id('cam').object3D.position.z = 0;
      if (this.currentSpot) this.currentSpot.setHere(false);
      if (spot) { spot.setHere(true); this.currentSpot = spot; }
    });
  },
  setScale(mode) {
    if (!SCALES[mode]) return;
    this.blink(() => { $id('rig').object3D.scale.setScalar(SCALES[mode]); });
    this.state.scale = mode;
    document.querySelectorAll('[ui-button]').forEach(b => {
      if (b.getAttribute('ui-button').action === 'scale') b.setAttribute('ui-button', 'active', b.getAttribute('ui-button').value === mode);
    });
  },
  onAction({ action, value }) {
    if (action === 'scale') this.setScale(value);
    if (action === 'night') { this.state.night = !this.state.night; this.setBtn('night', this.state.night); }
  },
  setBtn(action, on) {
    document.querySelectorAll('[ui-button]').forEach(b => { if (b.getAttribute('ui-button').action === action) b.setAttribute('ui-button', 'active', on); });
  },
  setNightImmediate(on) { this.state.night = on; this.nightT = on ? 1 : 0; NIGHT.apply(this.nightT); this.setBtn('night', on); },
  tick(t, dt) {
    if (!dt) return;
    const target = this.state.night ? 1 : 0;
    if (Math.abs(this.nightT - target) > 0.001) {
      this.nightT += Math.sign(target - this.nightT) * Math.min(Math.abs(target - this.nightT), dt / 2000);
      NIGHT.apply(this.nightT);
      const fog = this.el.object3D.fog; if (fog) fog.color.copy(lerpColor('#dcebf5', '#1c2a4a', this.nightT));
    }
  }
});

// スタート画面
/* =====================================================================
   左右2画面（ステレオ）表示
   WebXR非対応の端末（iPhoneのSafariなど）でもCardboardで立体視できるよう、
   画面を左右に分け、左目用・右目用のカメラで2回描画する
   ===================================================================== */
const STEREO = { on: false, cam: new THREE.StereoCamera(), size: new THREE.Vector2() };
STEREO.cam.aspect = 0.5;      // 1画面を左右半分ずつ使う
STEREO.cam.eyeSep = 0.064;    // 両目の間隔（約6.4cm）。視点スケールに合わせて自動で拡大縮小される
AFRAME.registerComponent('split-stereo', {
  init() {
    const patch = () => {
      const r = this.el.renderer; if (!r || r.__stereoPatched) return;
      r.__stereoPatched = true;
      const orig = r.render.bind(r);
      r.render = (scene, camera) => {
        if (!STEREO.on || r.xr.isPresenting) return orig(scene, camera);
        scene.updateMatrixWorld();
        STEREO.cam.update(camera);
        r.getSize(STEREO.size);
        const w = STEREO.size.x / 2, h = STEREO.size.y;
        r.setScissorTest(true);
        r.setScissor(0, 0, w, h); r.setViewport(0, 0, w, h); orig(scene, STEREO.cam.cameraL);
        r.setScissor(w, 0, w, h); r.setViewport(w, 0, w, h); orig(scene, STEREO.cam.cameraR);
        r.setScissorTest(false); r.setViewport(0, 0, STEREO.size.x, h);
      };
    };
    if (this.el.renderer) patch(); else this.el.addEventListener('renderstart', patch);
  }
});
function setStereo(on) {
  STEREO.on = on;
  document.body.classList.toggle('stereo', on);
  document.getElementById('stereo-btn').textContent = on ? '2画面を終了' : '2画面表示';
  const cam = document.getElementById('cam');
  if (cam) cam.setAttribute('camera', 'fov', on ? 90 : 80);
  if (on) {
    // 全画面・横向き固定（対応している端末のみ。iPhoneは手動で横向きに）
    const el = document.documentElement;
    const fs = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fs && !document.fullscreenElement) {
      try {
        const p = fs.call(el);
        if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
      } catch (e) {}
    }
  } else if (document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
}
document.getElementById('stereo-btn').addEventListener('click', () => setStereo(!STEREO.on));

function startExperience(stereo) {
  document.getElementById('intro').classList.add('hidden');
  if (stereo) setStereo(true);
}
document.getElementById('start-btn').addEventListener('click', () => startExperience(false));
document.getElementById('start-stereo-btn').addEventListener('click', () => startExperience(true));
</script>

    <a-cylinder radius="0.08" height="3.2" position="-1.6 13.9 -1.6" color="#5d6670"></a-cylinder>
    <a-cylinder radius="0.08" height="3.2" position="1.6 13.9 -1.6" color="#5d6670"></a-cylinder>
    <a-cylinder radius="0.08" height="3.2" position="-1.6 13.9 1.6" color="#5d6670"></a-cylinder>
  </a-entity>

  <!-- 池とアヒル -->
  <a-entity position="-16 0 6">
    <a-circle radius="5.2" rotation="-90 0 0" position="0 0.025 0" color="#4f9ad1" material="roughness: 0.15; metalness: 0.25"></a-circle>
    <a-torus radius="5.3" radius-tubular="0.22" rotation="-90 0 0" position="0 0.06 0" color="#a69f92" segments-tubular="48"></a-torus>
    <a-entity animation="property: rotation; to: 0 360 0; dur: 40000; loop: true; easing: linear">
      <a-entity position="2.8 0.1 0" rotation="0 180 0">
        <a-sphere radius="0.28" scale="1 0.7 1.3" color="#f5f5f0"></a-sphere>
        <a-sphere radius="0.14" position="0 0.25 0.25" color="#f5f5f0"></a-sphere>
        <a-cone radius-bottom="0.05" radius-top="0" height="0.12" position="0 0.24 0.4" rotation="90 0 0" color="#f39c12"></a-cone>
      </a-entity>
    </a-entity>
    <a-entity animation="property: rotation; to: 0 -360 0; dur: 55000; loop: true; easing: linear">
      <a-entity position="-1.6 0.1 1.2">
        <a-sphere radius="0.24" scale="1 0.7 1.3" color="#d9cdb4"></a-sphere>
        <a-sphere radius="0.12" position="0 0.22 0.22" color="#6b8f5a"></a-sphere>
        <a-cone radius-bottom="0.045" radius-top="0" height="0.1" position="0 0.21 0.35" rotation="90 0 0" color="#f39c12"></a-cone>
      </a-entity>
    </a-entity>
  </a-entity>

  <!-- 森（公園） -->
  <a-entity forest="x0: -62; z0: -8; x1: -26; z1: 36; count: 70; seed: 21; clearX: -40; clearZ: 10; clearR: 5"></a-entity>
  <a-entity forest="x0: -24; z0: 16; x1: 20; z1: 40; count: 26; seed: 33; scale: 1.1"></a-entity>

  <!-- 鳥 -->
  <a-entity position="-20 0 0">
    <a-entity circle-fly="radius: 16; speed: 0.3; phase: 0; y: 17">
      <a-box width="0.9" height="0.05" depth="0.3" position="0.45 0 0" color="#2b2b2b"></a-box>
      <a-box width="0.9" height="0.05" depth="0.3" position="-0.45 0 0" color="#2b2b2b"></a-box>
    </a-entity>
    <a-entity circle-fly="radius: 13; speed: 0.33; phase: 0.6; y: 19">
      <a-box width="0.8" height="0.05" depth="0.28" position="0.4 0 0" color="#2b2b2b"></a-box>
      <a-box width="0.8" height="0.05" depth="0.28" position="-0.4 0 0" color="#2b2b2b"></a-box>
    </a-entity>
  </a-entity>

  <!-- 風車の丘 -->
  <a-entity position="34 0 24" rotation="0 -50 0">
    <a-cone radius-bottom="1.6" radius-top="0.7" height="14" position="0 7 0" color="#f3efe6" shadow="cast: true"></a-cone>
    <a-sphere radius="0.8" position="0 14.2 0.6" color="#d9d2c3"></a-sphere>
    <a-entity position="0 14.2 1.3" animation="property: rotation; to: 0 0 360; dur: 9000; loop: true; easing: linear">
      <a-box width="0.6" height="7" depth="0.1" position="0 3.5 0" color="#e9e4d8" shadow="cast: true"></a-box>
      <a-box width="0.6" height="7" depth="0.1" position="0 -3.5 0" color="#e9e4d8" shadow="cast: true"></a-box>
      <a-box width="7" height="0.6" depth="0.1" position="3.5 0 0" color="#e9e4d8" shadow="cast: true"></a-box>
      <a-box width="7" height="0.6" depth="0.1" position="-3.5 0 0" color="#e9e4d8" shadow="cast: true"></a-box>
    </a-entity>
  </a-entity>

  <!-- 雲 -->
  <a-entity position="0 55 -60" cloud="seed: 1" drift="speed: 1.5"></a-entity>
  <a-entity position="-70 62 10" cloud="seed: 2" drift="speed: 1.1"></a-entity>
  <a-entity position="50 50 40" cloud="seed: 3" drift="speed: 1.3"></a-entity>
  <a-entity position="-20 70 -120" cloud="seed: 4" drift="speed: 1.0"></a-entity>
  <a-entity position="90 65 -30" cloud="seed: 5" drift="speed: 1.2"></a-entity>

  <!-- テレポート地点（最初の要素がスタート地点） -->
  <a-entity position="0 0 7" teleport-spot="name: 中央広場"></a-entity>
  <a-entity position="-16 0 13.5" teleport-spot="name: 池のほとり"></a-entity>
  <a-entity position="10 12.15 -2" teleport-spot="name: 展望塔の上"></a-entity>
  <a-entity position="20 0 -6" teleport-spot="name: 交差点の角"></a-entity>
  <a-entity position="-40 0 10" teleport-spot="name: 森の小道"></a-entity>
  <a-entity position="27 0 15" teleport-spot="name: 風車の丘"></a-entity>

  <!-- 利用者（リグ：位置と視点スケールを持つ） -->
  <a-entity id="rig" position="0 0 7">
    <a-entity id="cam" camera="near: 0.01; far: 1200" look-controls="pointerLockEnabled: false" wasd-controls="acceleration: 40" position="0 1.6 0">
      <!-- 視線カーソル（スマホ・VRでは見つめると決定） -->
      <a-entity cursor raycaster="objects: .clickable; far: 2000" position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.019"
                material="shader: flat; color: #ffffff; opacity: 0.9; transparent: true; depthTest: false"
                animation__fusing="property: scale; startEvents: fusing; from: 1 1 1; to: 2.4 2.4 2.4; dur: 1500; easing: linear"
                animation__leave="property: scale; startEvents: mouseleave; to: 1 1 1; dur: 120"
                animation__click="property: scale; startEvents: click; to: 1 1 1; dur: 120"></a-entity>
      <!-- 暗転用の球（テレポート時） -->
      <a-entity id="fade" geometry="primitive: sphere; radius: 0.2" material="shader: flat; color: #000; side: back; transparent: true; opacity: 0; depthTest: false"></a-entity>
    </a-entity>

    <!-- 足元メニュー -->
    <a-entity foot-menu>
      <a-entity position="0 0.72 -0.95" rotation="-55 0 0">
        <a-entity position="0 0.2 0" jp-label="text: メニュー; width: 0.5; fontSize: 46; bg: rgba(0,0,0,0); color: #ffffff"></a-entity>
        <a-entity position="-0.34 0.04 0" ui-button="label: 蟻の視点; action: scale; value: ant"></a-entity>
        <a-entity position="0 0.04 0" ui-button="label: 人の視点; action: scale; value: human; active: true"></a-entity>
        <a-entity position="0.34 0.04 0" ui-button="label: 巨人の視点; action: scale; value: giant"></a-entity>
        <a-entity position="0 -0.15 0" ui-button="label: 夜にする; action: night"></a-entity>
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>
</body>
</html>
