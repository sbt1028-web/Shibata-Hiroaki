<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>AR Mini Town - 空間情報コンピューティング 第6回課題</title>
  <!-- A-Frame と AR.js（A-Frame版・マーカーベースAR） -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ui {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 12px; pointer-events: none;
    }
    #status {
      background: rgba(0, 0, 0, 0.65); color: #fff; padding: 6px 14px;
      border-radius: 16px; font-size: 14px;
    }
    #status.found { background: rgba(20, 140, 80, 0.85); }
    #colorBtn {
      pointer-events: auto; border: none; border-radius: 20px; padding: 10px 18px;
      font-size: 15px; background: #ffffff; color: #222; box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="status">マーカーをカメラに映してください</div>
    <button id="colorBtn">ピンの色を変える</button>
  </div>

  <a-scene embedded
           arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
           vr-mode-ui="enabled: false"
           renderer="logarithmicDepthBuffer: true; antialias: true;">

    <!-- 自作マーカー（pattern-marker.patt）上にCGを重畳する -->
    <a-marker id="marker" type="pattern" url="pattern-marker.patt" smooth="true" smoothCount="5">
      <!-- マーカー1辺=1.0。CG全体をマーカーとほぼ同じ大きさに縮小して配置 -->
      <a-entity id="content" scale="0.6 0.6 0.6">

      <!-- 地面（地図に見立てた板） -->
      <a-plane rotation="-90 0 0" width="1.6" height="1.6" color="#7BC8A4" opacity="0.75"></a-plane>
      <a-ring rotation="-90 0 0" position="0 0.01 0" radius-inner="0.72" radius-outer="0.8" color="#2E7D5B"></a-ring>

      <!-- ミニチュアの街並み（建物） -->
      <a-box position="-0.45 0.25 -0.4" width="0.3" depth="0.3" height="0.5" color="#4CC3D9"></a-box>
      <a-box position="-0.05 0.4 -0.5" width="0.25" depth="0.25" height="0.8" color="#F5F5F5"></a-box>
      <a-box position="0.4 0.15 -0.35" width="0.35" depth="0.3" height="0.3" color="#FFC65D"></a-box>
      <a-box position="0.45 0.3 0.3" width="0.25" depth="0.25" height="0.6" color="#EF2D5E"></a-box>
      <a-cylinder position="-0.45 0.1 0.35" radius="0.08" height="0.2" color="#8B5A2B"></a-cylinder>
      <a-cone position="-0.45 0.35 0.35" radius-bottom="0.2" radius-top="0" height="0.35" color="#2E8B57"></a-cone>

      <!-- 位置ピン（上下に弾みながら回転する） -->
      <a-entity id="pin" position="0 0.9 0"
                animation__bounce="property: position; from: 0 0.9 0; to: 0 1.15 0; dir: alternate; dur: 900; loop: true; easing: easeInOutSine"
                animation__spin="property: rotation; to: 0 360 0; dur: 4000; loop: true; easing: linear">
        <a-sphere id="pinHead" radius="0.22" position="0 0.2 0" color="#E53935"></a-sphere>
        <a-cone id="pinTip" radius-bottom="0.18" radius-top="0.0" height="0.45" position="0 -0.1 0" rotation="180 0 0" color="#E53935"></a-cone>
        <a-sphere radius="0.08" position="0 0.2 0.18" color="#FFFFFF"></a-sphere>
      </a-entity>

      <!-- ピンの真下の影（目印） -->
      <a-circle rotation="-90 0 0" position="0 0.02 0" radius="0.18" color="#333" opacity="0.4"></a-circle>

      <!-- ラベル -->
      <a-text value="You are here!" position="0 1.65 0" align="center" color="#FFFFFF" width="3"
              side="double"></a-text>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // マーカーの検出状態を画面下部に表示する
    const marker = document.querySelector('#marker');
    const statusEl = document.querySelector('#status');
    marker.addEventListener('markerFound', () => {
      statusEl.textContent = 'マーカー検出中：CGを表示しています';
      statusEl.classList.add('found');
    });
    marker.addEventListener('markerLost', () => {
      statusEl.textContent = 'マーカーをカメラに映してください';
      statusEl.classList.remove('found');
    });

    // ボタンでピンの色を切り替える
    const colors = ['#E53935', '#1E88E5', '#FDD835', '#8E24AA', '#43A047'];
    let idx = 0;
    document.querySelector('#colorBtn').addEventListener('click', () => {
      idx = (idx + 1) % colors.length;
      document.querySelector('#pinHead').setAttribute('color', colors[idx]);
      document.querySelector('#pinTip').setAttribute('color', colors[idx]);
    });
  </script>
</body>
</html>
